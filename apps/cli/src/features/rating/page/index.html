<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rate photos</title>
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <header>
      <h1>Rate photos</h1>
      <output id="progress"></output>
    </header>
    <main>
      <figure>
        <div id="view"><img id="photo" alt="" hidden /></div>
        <figcaption id="caption"></figcaption>
      </figure>
      <ol id="frames" aria-label="Frames of this moment"></ol>
    </main>
    <footer>
      <p>
        <kbd>←</kbd> <kbd>→</kbd> other frames, <kbd>Space</kbd> keep this frame
        (the first one you keep is the best), <kbd>Z</kbd> full size, at the
        pointer,
        <kbd>Backspace</kbd> the moment before
      </p>
      <fieldset>
        <legend>Stars</legend>
        <div id="stars"></div>
      </fieldset>
    </footer>
    <script type="module" src="./page.ts"></script>
  </body>
</html>
