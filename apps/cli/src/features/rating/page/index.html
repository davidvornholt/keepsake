<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Rate photos</title>
    <link rel="stylesheet" href="./page.css" />
  </head>
  <body>
    <header>
      <h1 id="question" tabindex="-1">Rate photos</h1>
      <output id="notice"></output>
      <div id="progress">
        <progress id="rated" aria-labelledby="count"></progress>
        <span id="count"></span>
        <button type="button" id="back">
          <kbd aria-hidden="true">Backspace</kbd> Go back
        </button>
      </div>
    </header>
    <main id="main">
      <ol id="compare" aria-labelledby="question" hidden></ol>
      <div id="large" hidden>
        <div id="view"><img id="photo" alt="" /></div>
        <button type="button" id="before" aria-label="Photo before">←</button>
        <button type="button" id="after" aria-label="Next photo">→</button>
      </div>
    </main>
    <footer id="answers">
      <fieldset id="stars" aria-labelledby="question"></fieldset>
      <div id="tools">
        <button type="button" id="all">
          <kbd aria-hidden="true">Esc</kbd> <span id="all-label">All photos</span>
        </button>
        <button type="button" id="keep" aria-pressed="false">
          <kbd aria-hidden="true">K</kbd> Keep too
        </button>
        <button type="button" id="zoom" aria-pressed="false">
          <kbd aria-hidden="true">Z</kbd> Full size
        </button>
      </div>
    </footer>
    <script type="module" src="./page.ts"></script>
  </body>
</html>
